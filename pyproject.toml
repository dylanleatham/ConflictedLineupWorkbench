[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# The TestCase Pydantic model is domain vocabulary, not a pytest class
filterwarnings = ["ignore:cannot collect test class .TestCase.:pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Explicit so results don't shift when ruff changes its defaults
select = ["E4", "E7", "E9", "F"]
